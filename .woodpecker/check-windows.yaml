when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

labels:
  target: windows

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      lfs: false

steps:
  - name: check
    image: powershell
    commands:
      - $$ProgressPreference = 'SilentlyContinue'
      - $$V = (Get-Content .node-version -Raw).Trim()
      - $$T = Join-Path (Split-Path -Parent (Get-Location).Path) 'tools'
      - $$N = "node-v$$V-win-x64"
      - New-Item -ItemType Directory -Force -Path $$T | Out-Null
      - Invoke-WebRequest -UseBasicParsing -Uri "https://nodejs.org/dist/v$$V/$$N.zip" -OutFile "$$T\$$N.zip"
      - Invoke-WebRequest -UseBasicParsing -Uri "https://nodejs.org/dist/v$$V/SHASUMS256.txt" -OutFile "$$T\SHASUMS256.txt"
      - $$E = ((Get-Content "$$T\SHASUMS256.txt" | Where-Object { $$_.EndsWith(" $$N.zip") }) -split '\s+')[0]
      - if (-not $$E -or (Get-FileHash -Algorithm SHA256 "$$T\$$N.zip").Hash -ne $$E.ToUpperInvariant()) { throw "Checksum mismatch for $$N.zip" }
      - tar.exe -xf "$$T\$$N.zip" -C $$T; if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
      - $$env:Path = "$$T\$$N;$$env:Path"
      - $$P = ((Get-Content package.json -Raw | ConvertFrom-Json).packageManager -split '@')[1]
      - npm.cmd install --global --no-fund --no-audit --prefix "$$T\pnpm" "pnpm@$$P"; if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
      - $$env:Path = "$$T\pnpm;$$env:Path"
      - node.exe --version; if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
      - pnpm.cmd --version; if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
      - pnpm.cmd install --frozen-lockfile; if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
      - pnpm.cmd browser:install; if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
      - pnpm.cmd check; if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
